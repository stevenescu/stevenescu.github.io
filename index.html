<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ștefan-Cristian Chița</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #151b26;
            --border-color: #263042;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #3b82f6;
            --status-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-color) 70%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--status-color);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--status-color);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        h1 {
            font-size: clamp(1.5rem, 4.5vw, 2.1rem);
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin-bottom: 24px;
        }

        .links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .footer-link {
            display: inline-block;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: #1f2937;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .footer-link:hover {
            background-color: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge">
            <span class="dot"></span>
            În construcție
        </div>
        <h1>Chița Ștefan-Cristian</h1>
        <p>Site-ul este în curs de configurare și va fi disponibil în curând.</p>
        <div class="divider"></div>
        <div class="links">
            <a href="https://github.com/stevenescu" target="_blank" class="footer-link">GitHub</a>
            <a href="mailto:contact@stefanchita.ro" class="footer-link">contact@stefanchita.ro</a>
        </div>
    </div>
</body>
</html>
